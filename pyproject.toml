[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pytes"
version = "0.0.1"
description = "Models and tools for heat batteries (thermal energy storage), built on PyBaMM"
readme = "README.md"
license = "BSD-3-Clause"
# The Python versions PyBaMM supports (CLAUDE.md: test them all)
requires-python = ">=3.10,<3.16"
dependencies = [
  "pybamm>=26.7",
  "numpy",
  # pytes.validation (also a PyBaMM dependency, declared as PyTES uses it directly)
  "scipy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
# pybamm.dynamic_plot and QuickPlot sliders in notebooks need ipywidgets
plot = ["matplotlib", "ipywidgets"]

[dependency-groups]
dev = [
  "pre-commit>=3.7",
  "pytest>=8.0",
  "ruff>=0.17",
]
# Running the example notebooks (also in VS Code)
notebooks = [
  "ipykernel",
  "pytes[plot]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytes"]

[tool.uv]
default-groups = ["dev", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: long-running tests (run with -m slow)"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Docstrings may run past 88 characters; the formatter wraps code
ignore = ["E501"]
