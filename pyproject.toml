[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pytes-thermal"
version = "0.1.0a2"
description = "Models and tools for heat batteries (thermal energy storage), built on PyBaMM"
readme = "README.md"
license = "BSD-3-Clause"
# The Python versions PyBaMM supports (CLAUDE.md: test them all)
requires-python = ">=3.10,<3.16"
dependencies = [
  # 26.9 added pybamm.tree_map and pybamm.rebuild (used by pytes.compat.coupled)
  "pybamm>=26.9",
  "numpy",
  # pytes.validation (also a PyBaMM dependency, declared as PyTES uses it directly)
  "scipy",
]
urls = { Homepage = "https://github.com/mmsg-warwick/PyTES", Issues = "https://github.com/mmsg-warwick/PyTES/issues", Changelog = "https://github.com/mmsg-warwick/PyTES/blob/main/CHANGELOG.md" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
# pybamm.dynamic_plot and QuickPlot sliders in notebooks need ipywidgets
plot = ["matplotlib", "ipywidgets"]

[dependency-groups]
dev = [
  "nbmake>=1.5.5",
  "pre-commit>=3.7",
  "pytest>=8.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17",
  "towncrier>=26.9.0",
]
# Running the example notebooks (also in VS Code)
notebooks = [
  "ipykernel",
  "pytes-thermal[plot]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytes"]

# The source distribution lists what it contains, so that untracked local files (editor or
# shell settings in the working directory) never end up in it
[tool.hatch.build.targets.sdist]
include = [
  "src/pytes",
  "tests",
  "examples",
  "docs/design",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "CITATION.cff",
  "LICENSE",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: long-running tests (run with -m slow)"]

[tool.coverage.run]
source = ["pytes"]
branch = true

[tool.coverage.report]
# Every line and branch is tested (all tests, slow ones included); CI fails below this
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["raise NotImplementedError"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Docstrings may run past 88 characters; the formatter wraps code
ignore = ["E501"]

[tool.towncrier]
# Changelog fragments (CONTRIBUTING.md): one file per change in changelog.d/, named
# <PR number>.<type>.md, assembled into CHANGELOG.md at release
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/mmsg-warwick/PyTES/pull/{issue})"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "contract"
name = "Model contract changes"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features"
showcontent = true

[[tool.towncrier.type]]
directory = "improvement"
name = "Improvements"
showcontent = true

[[tool.towncrier.type]]
directory = "fix"
name = "Bug fixes"
showcontent = true
