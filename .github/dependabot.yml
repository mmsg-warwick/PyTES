# Dependabot (CONTRIBUTING.md): a monthly pull request bumping the GitHub Actions the
# workflows use, all in one, so that they keep up with the runners (e.g. the move to
# Node.js 24). Labelled "no changelog": these are internal changes.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
    labels: ["no changelog"]
