# Tests (CLAUDE.md): on Linux, every Python version PyBaMM supports, and on macOS and
# Windows the oldest and newest, against the latest PyBaMM release (blocking); PyBaMM main
# (non-blocking); pre-commit, coverage (all tests, slow ones included, uploaded to Codecov),
# the example notebooks and the documentation, on Linux.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch new PyBaMM releases and changes on PyBaMM main
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the reference platform: every Python version PyBaMM supports. macOS
        # (Apple silicon) and Windows run the oldest and newest, where platform problems
        # show; coverage, notebooks and PyBaMM main run on Linux only
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - {os: macos-latest, python-version: "3.10"}
          - {os: macos-latest, python-version: "3.15"}
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.15"}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      # The latest PyBaMM release the constraints allow, not the locked one, with its
      # compiled solvers (whose new releases add wheels for new Python versions)
      - run: uv sync --upgrade-package pybamm --upgrade-package pybammsolvers
      - run: uv run pytest

  coverage:
    name: Coverage (all tests, slow ones included)
    runs-on: ubuntu-latest
    # The upload authenticates with GitHub's OIDC token, so no Codecov secret is needed
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
      - run: uv sync --upgrade-package pybamm --upgrade-package pybammsolvers
      - run: uv run pytest -m "" --cov --cov-report=xml
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          # A Codecov outage should not fail the tests
          fail_ci_if_error: false

  notebooks:
    name: Example notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
      - run: uv sync --upgrade-package pybamm --upgrade-package pybammsolvers
      # Executes every notebook in examples/ and fails if a cell raises
      - run: uv run pytest --nbmake examples/

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
      - run: uv sync --no-default-groups --group docs
      # As on Read the Docs: any warning (a broken reference, a bad docstring) fails
      - run: uv run --no-sync sphinx-build -W --keep-going docs docs/_build/html

  pybamm-main:
    name: PyBaMM main (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # PyBaMM main is a uv workspace that also holds the solvers (packages/pybammsolvers).
      # Their version is only bumped at a release, so the PyPI wheel cannot be told apart
      # from main's source, which may need it (main called a solver function that no
      # release had). So both are built from main's source, as PyBaMM's own tests do.
      - uses: actions/checkout@v7
        with:
          repository: pybamm-team/PyBaMM
          ref: main
          path: pybamm-main
          submodules: recursive
          # pybamm's version comes from its git tags: the history without file contents
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
      # Building SUNDIALS and SuiteSparse takes most of the time. They are built into
      # packages/pybammsolvers/.idaklu, which the solver module finds through an absolute
      # RPATH, so that folder is cached, keyed on what it is built from: the submodule pins
      # and the build script. On a cache hit only the solver module itself is compiled.
      - name: Solver libraries cache key
        id: solver-libraries
        working-directory: pybamm-main/packages/pybammsolvers
        run: >-
          echo "key=idaklu-${{ runner.os }}-$(git rev-parse HEAD:./sundials
          HEAD:./SuiteSparse HEAD:./install_KLU_Sundials.py | sha256sum | cut -c1-16)"
          >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: pybamm-main/packages/pybammsolvers/.idaklu
          key: ${{ steps.solver-libraries.outputs.key }}
      # The compilers and BLAS that PyBaMM's tests install
      - run: sudo apt-get update && sudo apt-get install -y gfortran libopenblas-dev
      - run: uv sync
      # Without the workspace sources: through them pybamm pulls in pybammsolvers as an
      # editable install, which rebuilds itself on import, without its build tools
      - run: >-
          uv pip install --no-sources ./pybamm-main/packages/pybammsolvers
          ./pybamm-main/packages/pybamm
      - run: uv run --no-sync pytest

  changelog:
    name: Changelog fragment
    # A pull request with a user-visible change adds a fragment in changelog.d/
    # (CONTRIBUTING.md); internal changes are labelled "no changelog"
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run towncrier check --compare-with origin/${{ github.base_ref }}
