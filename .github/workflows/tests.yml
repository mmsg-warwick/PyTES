# Tests (CLAUDE.md): every Python version PyBaMM supports, against the latest PyBaMM
# release (blocking) and PyBaMM main (non-blocking), plus pre-commit and coverage (all
# tests, slow ones included, uploaded to Codecov).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch new PyBaMM releases and changes on PyBaMM main
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Python ${{ matrix.python-version }}, latest PyBaMM release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      # The latest PyBaMM release the constraints allow, not the locked one, with its
      # compiled solvers (whose new releases add wheels for new Python versions)
      - run: uv sync --upgrade-package pybamm --upgrade-package pybammsolvers
      - run: uv run pytest

  coverage:
    name: Coverage (all tests, slow ones included)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --upgrade-package pybamm --upgrade-package pybammsolvers
      - run: uv run pytest -m "" --cov --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage should not fail the tests
          fail_ci_if_error: false

  notebooks:
    name: Example notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --upgrade-package pybamm --upgrade-package pybammsolvers
      # Executes every notebook in examples/ and fails if a cell raises
      - run: uv run pytest --nbmake examples/

  pybamm-main:
    name: PyBaMM main (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      # PyBaMM main is a uv workspace (packages/pybamm, packages/pybammsolvers, ...); install
      # the pybamm package only. Its workspace source for pybammsolvers would compile the
      # solvers (SuiteSparse, SUNDIALS, which need BLAS), so take pybammsolvers from PyPI
      # instead. If main ever requires an unreleased pybammsolvers, build it with BLAS.
      - run: >-
          uv pip install --no-sources-package pybammsolvers
          "pybamm @ git+https://github.com/pybamm-team/PyBaMM.git@main#subdirectory=packages/pybamm"
      - run: uv run --no-sync pytest

  changelog:
    name: Changelog fragment
    # A pull request with a user-visible change adds a fragment in changelog.d/
    # (CONTRIBUTING.md); internal changes are labelled "no changelog"
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv run towncrier check --compare-with origin/${{ github.base_ref }}
