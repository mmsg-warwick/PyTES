name: Bug report
description: Something does not work, or gives wrong results
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal example
      description: The shortest code that reproduces the problem, with the full error message if there is one.
      render: python
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: >-
        The output of
        `python -c "import platform, pybamm, pytes; print(platform.platform(), platform.python_version(), pybamm.__version__, pytes.__version__)"`
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that may help, e.g. whether it worked with an earlier version of PyTES or PyBaMM.
